name: Update README cards
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate top-langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate pinned repo card - AI Expense Tracker
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=AI-Expense-Tracker&theme=tokyonight&hide_border=true
          path: profile/pin-ai-expense-tracker.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate pinned repo card - Kostpro
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Kostpro&theme=tokyonight&hide_border=true
          path: profile/pin-kostpro.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate pinned repo card - Tugas Sig
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Tugas-Sig&theme=tokyonight&hide_border=true
          path: profile/pin-tugas-sig.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate pinned repo card - Nlp Command Parser
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Nlp-Command-Parser&theme=tokyonight&hide_border=true
          path: profile/pin-nlp-command-parser.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
