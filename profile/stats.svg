<svg width="440" height="150" viewBox="0 0 440 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill:#1a1b27; stroke:#7aa2f7; stroke-width:1.5; }
    .title { font: 600 13px 'Segoe UI', sans-serif; fill:#7aa2f7; }
    .value { font: 700 26px 'Segoe UI', sans-serif; fill:#ffffff; }
  </style>
  <rect class="bg" x="10" y="10" width="100" height="130" rx="12"/>
  <text x="60" y="50" text-anchor="middle" class="title">Repos</text>
  <text x="60" y="90" text-anchor="middle" class="value">17</text>

  <rect class="bg" x="120" y="10" width="100" height="130" rx="12"/>
  <text x="170" y="50" text-anchor="middle" class="title">Stars</text>
  <text x="170" y="90" text-anchor="middle" class="value">1</text>

  <rect class="bg" x="230" y="10" width="100" height="130" rx="12"/>
  <text x="280" y="50" text-anchor="middle" class="title">Forks</text>
  <text x="280" y="90" text-anchor="middle" class="value">0</text>

  <rect class="bg" x="340" y="10" width="90" height="130" rx="12"/>
  <text x="385" y="50" text-anchor="middle" class="title">Followers</text>
  <text x="385" y="90" text-anchor="middle" class="value">2</text>
</svg>
